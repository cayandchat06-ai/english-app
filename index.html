let S={cur:0,tab:'home',fi:0,qi:0,qs:0,qa:false,
  prog:JSON.parse(localStorage.getItem('p4000b2')||'{}')};
function save(){localStorage.setItem('p4000b2',JSON.stringify(S.prog))}
function markU(u,t){const k='u'+u;if(!S.prog[k])S.prog[k]={q:0,r:0};S.prog[k][t]=1;save()}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');
  const n=c==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';
  localStorage.setItem('th4000',n)}

function speak(t){if(!('speechSynthesis'in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;
  window.speechSynthesis.speak(u)}

function go(t){S.tab=t;S.qi=0;S.qs=0;S.qa=false;S.fi=0;render();
  window.scrollTo({top:0,behavior:'smooth'})}
function selU(i){S.cur=i;go('words')}

function render(){
  const r=document.getElementById('view');
  const tabs=['home','words','flash','quiz','reading'];
  document.querySelectorAll('.nav').forEach((n,i)=>n.classList.toggle('on',tabs[i]===S.tab));
  if(S.tab==='home')r.innerHTML=hHome();
  else if(S.tab==='words')r.innerHTML=hWords();
  else if(S.tab==='flash')r.innerHTML=hFlash();
  else if(S.tab==='quiz')r.innerHTML=hQuiz();
  else if(S.tab==='reading')r.innerHTML=hReading();
}

function hHome(){
  const T=UNITS.length;
  const D=UNITS.filter((u,i)=>{const p=S.prog['u'+i];return p&&p.q===1&&p.r===1}).length;
  const P=T?Math.round(D/T*100):0;
  const g=UNITS.map((u,i)=>{
    const p=S.prog['u'+i]||{};
    const d=p.q===1&&p.r===1;
    return`<div class="ucard ${d?'done':''} ${S.cur===i?'cur':''}" onclick="selU(${i})">
      <div class="unum">${u.n}</div>
      <div class="ulbl">Unit</div>
      <div class="ucnt">${u.w.length} слов</div>
    </div>`}).join('');
  return`<div class="hero"><h2>Добро пожаловать! 👋</h2>
    <p>30 юнитов · 600 слов · перевод на русский</p></div>
    <div class="pbar"><div class="pfill" style="width:${P}%"></div></div>
    <div class="ptext">${D}/${T} юнитов · ${P}%</div>
    <div class="ugrid">${g}</div>
    <div class="content"><div class="wcard" style="text-align:center">
      <div style="font-size:30px;margin-bottom:6px">🇷🇺</div>
      <div style="font-weight:700;margin-bottom:4px">Все слова с переводом</div>
      <div style="font-size:12px;color:var(--tm)">Каждое слово — с переводом и озвучкой</div>
    </div></div>`;
}

function hWords(){
  const u=UNITS[S.cur];
  const w=u.w.map((x,i)=>`
    <div class="wcard">
      <div class="whd">
        <div class="w">${x[6]} ${x[0]}</div>
        <div class="pos">${x[2]}</div>
      </div>
      <div class="tr">${x[1]}</div>
      <div class="ru">🇷🇺 ${x[4]}</div>
      <div class="def"><span class="lbl">EN:</span> ${x[3]}</div>
      <div class="ex">${x[5].replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>
      <button class="spk" onclick="event.stopPropagation();speak('${x[0]}')">🔊</button>
    </div>`).join('');
  return`<div class="tabs"><div class="tab on">📖 Unit ${u.n} · ${u.w.length} слов</div></div>
    <div class="content">${w}</div>`;
}

function hFlash(){
  const u=UNITS[S.cur];const w=u.w[S.fi];
  return`<div class="tabs"><div class="tab on">🃏 Карточка ${S.fi+1}/${u.w.length}</div></div>
    <div class="content">
      <div class="fwrap"><div class="fcard" onclick="this.classList.toggle('flip')">
        <div class="fside ffront">
          <div class="fw">${w[6]} ${w[0]}</div>
          <div class="fp">${w[1]} · ${w[2]}</div>
          <div class="fhint">👆 Нажми, чтобы увидеть перевод</div>
        </div>
        <div class="fside fback">
          <div class="fbd">🇷🇺 ${w[4]}</div>
          <div class="fbe"><b>EN:</b> ${w[3]}</div>
          <div class="fbe">${w[5].replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>
        </div>
      </div></div>
      <div class="fnav">
        <button class="btn sec" onclick="prevF()">←</button>
        <button class="btn" onclick="speak('${w[0]}')">🔊</button>
        <button class="btn sec" onclick="nextF()">→</button>
      </div>
      <div class="fctr">${S.fi+1} / ${u.w.length}</div>
    </div>`;
}
function nextF(){const u=UNITS[S.cur];S.fi=(S.fi+1)%u.w.length;render()}
function prevF(){const u=UNITS[S.cur];S.fi=(S.fi-1+u.w.length)%u.w.length;render()}

function hQuiz(){
  const u=UNITS[S.cur];const T=u.w.length;
  if(S.qi>=T){markU(S.cur,'q');return`
    <div class="tabs"><div class="tab on">✍️ Квиз завершён</div></div>
    <div class="content"><div class="empty">
      <div class="em">🎉</div><h3>Отлично!</h3>
      <p>Результат: <b style="color:var(--p);font-size:20px">${S.qs}/${T}</b></p>
      <button class="btn" style="margin-top:14px" onclick="go('quiz')">Пройти снова</button>
    </div></div>`}
  const w=u.w[S.qi];
  const o=u.w.filter((_,i)=>i!==S.qi);
  const sh=[...o].sort(()=>Math.random()-.5).slice(0,3);
  const opts=[...sh,w].sort(()=>Math.random()-.5);
  const ci=opts.findIndex(x=>x[0]===w[0]);
  return`<div class="tabs"><div class="tab on">✍️ ${S.qi+1}/${T}</div></div>
    <div class="content">
      <div class="qhd">
        <div class="qn">Выбери перевод слова</div>
        <div class="qq">${w[6]} ${w[0]}</div>
        <div class="qs">${w[1]} · ${w[2]}</div>
      </div>
      <div class="opts">${opts.map((x,i)=>
        `<button class="opt" onclick="ansQ(${i},${ci})">${x[4]}</button>`).join('')}</div>
      <div style="text-align:center;margin-top:14px;color:var(--tm);font-size:12px">Счёт: ${S.qs}</div>
    </div>`;
}
function ansQ(s,c){
  if(S.qa)return;S.qa=true;
  const b=document.querySelectorAll('.opt');
  b.forEach((x,i)=>{x.classList.add('dis');
    if(i===c)x.classList.add('correct');
    else if(i===s)x.classList.add('wrong')});
  if(s===c)S.qs++;
  setTimeout(()=>{S.qi++;S.qa=false;render()},1100);
}

function hReading(){
  const u=UNITS[S.cur];
  return`<div class="tabs"><div class="tab on">📄 Unit ${u.n}</div></div>
    <div class="content">
      <div class="rtitle">${u.t}</div>
      <div class="rtext"><p style="text-align:center;color:var(--tm)">
        Читайте текст в оригинале книги (PDF). Ключевые слова смотрите во вкладке «Слова».
      </p></div>
    </div>`;
}

(function(){
  const t=localStorage.getItem('th4000');
  if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('themeBtn').textContent='☀️'}
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
